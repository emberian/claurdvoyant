name: Deploy web viewer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Best-effort: build the WASM ingest module into web/pkg/.
      # If the crate isn't present yet (or the build fails), we still deploy the
      # static site, which runs in demo mode with the bundled sample dataset.
      - name: Build cv-web (WASM)
        id: wasm
        continue-on-error: true
        run: |
          if [ -f crates/cv-web/Cargo.toml ]; then
            wasm-pack build crates/cv-web --target web --out-dir ../../web/pkg --no-default-features
          else
            echo "crates/cv-web not present yet; skipping WASM build (site will run in demo mode)."
          fi

      # Build the mdBook user manual and nest it under the site at /manual/.
      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.2'

      - name: Build the manual
        run: |
          mdbook build manual
          rm -rf web/manual
          mkdir -p web/manual
          cp -r manual/book/. web/manual/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
