name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: build · test · clippy · fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Build (default features)
        run: cargo build --workspace --all-targets

      - name: Test (default features)
        run: cargo test --workspace

      - name: Build cv-core for wasm config (no default features)
        run: cargo build -p cv-core --no-default-features

      # Advisory (don't fail the build) — surfaces nits without blocking.
      - name: Format check
        run: cargo fmt --all --check
        continue-on-error: true

      - name: Clippy
        run: cargo clippy --workspace --all-targets
        continue-on-error: true

  wasm:
    name: wasm build (cv-web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
      - name: Build cv-web to wasm
        run: wasm-pack build --target web --out-dir /tmp/pkg crates/cv-web -- --no-default-features
