[workspace]
resolver = "2"
members = ["crates/cv-core", "crates/cv", "crates/cv-mcp", "crates/cvd", "crates/cv-web", "crates/cv-search", "crates/cv-llm", "crates/cv-tui"]

[workspace.package]
version = "0.9.17"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/emberian/cv"
authors = ["ember"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
walkdir = "2"
rayon = "1"
percent-encoding = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
# Pure-Rust zstd (decode for Zed's compressed thread blobs; encode used only by tests). Chosen over
# the C-binding `zstd` crate because this workspace cross-compiles to 7 targets via cargo-dist
# (including windows-msvc and i686) and a C toolchain dependency would complicate every one.
ruzstd = "0.8"
dirs = "5"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "v7"] }
# Human-editable config (`~/.config/clustervision/config.toml`). Pure Rust.
toml = "0.8"
# BurntSushi's regex engine — powers the query calculus's `~` (regex-match) operator. Linear-time
# (no catastrophic backtracking) and already in the tree transitively (tantivy), so it's near-free.
regex = "1"

[profile.release]
opt-level = 3
lto = "thin"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
