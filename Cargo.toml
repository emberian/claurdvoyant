[workspace]
resolver = "2"
members = ["crates/cv-core", "crates/cv", "crates/cv-mcp", "crates/cvd", "crates/cv-web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/emberian/claurdvoyant"
authors = ["ember"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
walkdir = "2"
percent-encoding = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "v7"] }

[profile.release]
opt-level = 3
lto = "thin"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
